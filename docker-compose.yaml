services:
  postgres:
    profiles:
      - dev
    image: postgres:18.2-alpine
    container_name: goobz_db
    restart: unless-stopped
    ports:
      - "${GOOBZ_POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${GOOBZ_POSTGRES_USER}
      POSTGRES_PASSWORD: ${GOOBZ_POSTGRES_PASSWORD}
      POSTGRES_DB: ${GOOBZ_POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
